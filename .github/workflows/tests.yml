# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: 🧪 Tests

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths-ignore: ['**.md']
    tags-ignore: ['**']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-leaks:
    name: Check for GitLeaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: gacts/gitleaks@v1

  lint-and-test-server:
    name: Test and lint the server
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ./server}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: ./server/go.mod, cache-dependency-path: ./server/go.sum}
      - uses: golangci/golangci-lint-action@v9
        with:
          # renovate: source=github-releases name=golangci/golangci-lint extractVersion=^(?<version>v.+)$
          version: v2.15.0
          working-directory: ./server
      - run: go test -race -covermode=atomic ./...
