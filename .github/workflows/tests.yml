# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: 🧪 Tests

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths-ignore: ['**.md']
    tags-ignore: ['**']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-leaks:
    name: Check for GitLeaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: gacts/gitleaks@v1

  lint-and-test-server:
    name: Test and lint the server
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ./server}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: ./server/go.mod, cache-dependency-path: ./server/go.sum}
      - uses: golangci/golangci-lint-action@v9
        with:
          # renovate: source=github-releases name=golangci/golangci-lint extractVersion=^(?<version>v.+)$
          version: v2.15.0
          working-directory: ./server
      - run: go test -race -covermode=atomic ./...

  build-mod:
    name: Build the mod (pbo) file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with: {path: ./tools, key: "${{ runner.os }}-makefile-${{ hashFiles('Makefile') }}"}
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends --yes libvorbisenc2
      - run: make dist/mod
      - run: zip -r -X ../../mod.zip ./*
        working-directory: ./dist/mod
      - run: tar --create --gzip --file=../../mod.tar.gz --mtime='@0' --owner=0 --group=0 *
        working-directory: ./dist/mod
      - uses: actions/upload-artifact@v7
        with: {name: mod.zip, path: ./mod.zip, if-no-files-found: error, archive: false}
      - uses: actions/upload-artifact@v7
        with: {name: mod.tar.gz, path: ./mod.tar.gz, if-no-files-found: error, archive: false}

  build-server:
    name: Build the server binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: ./server/go.mod, cache-dependency-path: ./server/go.sum}
      - run: make dist/statez-server
        env: {GOOS: linux, GOARCH: amd64}
      - run: zip -X ../statez-server.zip statez-server
        working-directory: ./dist
      - run: tar --create --gzip --file=../statez-server.tar.gz --mtime='@0' --owner=0 --group=0 statez-server
        working-directory: ./dist
      - uses: actions/upload-artifact@v7
        with: {name: statez-server.zip, path: ./statez-server.zip, if-no-files-found: error, archive: false}
      - uses: actions/upload-artifact@v7
        with: {name: statez-server.tar.gz, path: ./statez-server.tar.gz, if-no-files-found: error, archive: false}
